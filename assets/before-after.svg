<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="340" fill="none">
  <defs>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="880" height="340" rx="16" fill="#08090C" />

  <!-- ================= LEFT: GENERIC AI SLOP (BAD) ================= -->
  <g transform="translate(20, 20)">
    <!-- Container -->
    <rect width="410" height="300" rx="14" fill="#050505" stroke="#7F1D1D" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Bad Badge -->
    <rect x="20" y="20" width="180" height="24" rx="6" fill="#991B1B" />
    <text x="110" y="36" fill="#FEE2E2" font-size="11" class="mono" font-weight="bold" text-anchor="middle">❌ GENERIC AI SLOP</text>

    <!-- Ugly Purple Blob Simulation -->
    <circle cx="205" cy="130" r="70" fill="#A855F7" opacity="0.35" filter="blur(20px)" />
    <circle cx="240" cy="150" r="50" fill="#EC4899" opacity="0.25" filter="blur(25px)" />

    <!-- Ugly Centered Content -->
    <text x="205" y="90" fill="#FFFFFF" font-size="20" class="sans" font-weight="bold" text-anchor="middle">Our Amazing AI Platform</text>
    <text x="205" y="112" fill="#A1A1AA" font-size="11" class="sans" text-anchor="middle">The best solution for your business in the modern world</text>

    <!-- Bad Symmetrical 3 Cards (The Cliché) -->
    <g transform="translate(25, 140)">
      <rect x="0" y="0" width="112" height="90" rx="8" fill="#18181B" stroke="#27272A" />
      <text x="56" y="30" fill="#E4E4E7" font-size="11" class="sans" font-weight="bold" text-anchor="middle">Feature 1</text>
      <text x="56" y="52" fill="#71717A" font-size="9" class="sans" text-anchor="middle">Fast &amp; reliable</text>
      <rect x="26" y="66" width="60" height="14" rx="4" fill="#6D28D9" />

      <rect x="124" y="0" width="112" height="90" rx="8" fill="#18181B" stroke="#27272A" />
      <text x="180" y="30" fill="#E4E4E7" font-size="11" class="sans" font-weight="bold" text-anchor="middle">Feature 2</text>
      <text x="180" y="52" fill="#71717A" font-size="9" class="sans" text-anchor="middle">Easy to use</text>
      <rect x="150" y="66" width="60" height="14" rx="4" fill="#6D28D9" />

      <rect x="248" y="0" width="112" height="90" rx="8" fill="#18181B" stroke="#27272A" />
      <text x="304" y="30" fill="#E4E4E7" font-size="11" class="sans" font-weight="bold" text-anchor="middle">Feature 3</text>
      <text x="304" y="52" fill="#71717A" font-size="9" class="sans" text-anchor="middle">Secure &amp; safe</text>
      <rect x="274" y="66" width="60" height="14" rx="4" fill="#6D28D9" />
    </g>

    <!-- Disasters summary -->
    <text x="205" y="265" fill="#EF4444" font-size="11" class="sans" text-anchor="middle">⚠️ 紫色渐变球 · 无脑三等分对称 · 零物理反馈 · 松垮字距</text>
  </g>

  <!-- ================= RIGHT: VIBE FRONTEND DESIGN (CRAFT) ================= -->
  <g transform="translate(450, 20)">
    <!-- Container -->
    <rect width="410" height="300" rx="14" fill="#0C0D12" stroke="rgba(59,130,246,0.3)" stroke-width="1.5" />

    <!-- Good Badge -->
    <rect x="20" y="20" width="200" height="24" rx="6" fill="#1E3A8A" />
    <text x="120" y="36" fill="#93C5FD" font-size="11" class="mono" font-weight="bold" text-anchor="middle">✅ VIBE DESIGN CRAFT</text>

    <!-- High-taste Header with tight tracking -->
    <text x="24" y="80" fill="#FFFFFF" font-size="18" class="sans" font-weight="800" letter-spacing="-0.5">面向高吞吐工程体系的情报终端</text>
    <text x="24" y="100" fill="#71717A" font-size="11" class="sans">紧凑负字距 · 表面四层层级 · 物理弹簧阻尼微交互</text>

    <!-- Asymmetric Bento Mini Grid -->
    <g transform="translate(24, 120)">
      <!-- Main Tile (Hero) -->
      <rect x="0" y="0" width="230" height="110" rx="10" fill="#14151D" stroke="rgba(255,255,255,0.1)" />
      <text x="14" y="24" fill="#60A5FA" font-size="9" class="mono" font-weight="bold">BENTO HERO (2x2)</text>
      <text x="14" y="44" fill="#FFFFFF" font-size="12" class="sans" font-weight="bold">实时流拓扑画布</text>
      <!-- Sub elements -->
      <circle cx="30" cy="75" r="12" fill="#1E202E" stroke="#3B82F6" stroke-width="1.5" />
      <path d="M 42 75 L 100 75" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="2 2" />
      <circle cx="112" cy="75" r="12" fill="#1E202E" stroke="#10B981" stroke-width="1.5" />
      <text x="150" y="79" fill="#10B981" font-size="11" class="mono">&lt; 8ms</text>

      <!-- Side Metric Tile -->
      <rect x="242" y="0" width="120" height="50" rx="10" fill="#14151D" stroke="rgba(255,255,255,0.08)" />
      <text x="254" y="20" fill="#71717A" font-size="8" class="mono">STABILITY</text>
      <text x="254" y="38" fill="#FFFFFF" font-size="16" class="sans" font-weight="bold">CLS = 0</text>

      <!-- Side Magnetic CTA Tile -->
      <rect x="242" y="58" width="120" height="52" rx="10" fill="#14151D" stroke="rgba(255,255,255,0.08)" />
      <rect x="252" y="70" width="100" height="28" rx="6" fill="#FFFFFF" />
      <text x="302" y="88" fill="#090A0F" font-size="10" class="sans" font-weight="bold" text-anchor="middle">磁吸 CTA ➔</text>
    </g>

    <!-- Success summary -->
    <text x="205" y="265" fill="#34D399" font-size="11" class="sans" text-anchor="middle">✨ 便当盒网格 · 1px 微发光边框 · 骨架屏 0 抖动 · 盘古中西排版</text>
  </g>
</svg>
