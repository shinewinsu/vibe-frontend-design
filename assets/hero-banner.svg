<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="100%" height="280" fill="none">
  <defs>
    <!-- Background Grid -->
    <pattern id="banner-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    </pattern>

    <!-- Animated Gradient for Heading -->
    <linearGradient id="hero-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#93C5FD" />
      <stop offset="80%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
      <animate attributeName="x1" values="0%;100%;0%" dur="10s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <radialGradient id="center-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#08090C" stop-opacity="0" />
    </radialGradient>

    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif; }
      @keyframes pulseDot {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      .pulsing { transform-origin: center; animation: pulseDot 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect width="880" height="280" rx="16" fill="#08090C" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <rect width="880" height="280" rx="16" fill="url(#banner-grid)" />
  <rect width="880" height="280" rx="16" fill="url(#center-glow)" />

  <!-- Top Pill Badge -->
  <g transform="translate(320, 36)">
    <rect width="240" height="28" rx="14" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.3)" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#60A5FA" class="pulsing" />
    <text x="28" y="18" fill="#93C5FD" font-size="11" class="mono" font-weight="600" letter-spacing="0.5">THE ANTI-SLOP CRAFT SKILL</text>
  </g>

  <!-- Big Title -->
  <text x="440" y="118" text-anchor="middle" fill="url(#hero-grad)" font-size="44" class="sans" font-weight="800" letter-spacing="-1.5">
    vibe-frontend-design
  </text>

  <!-- Bilingual Taglines -->
  <text x="440" y="160" text-anchor="middle" fill="#E4E4E7" font-size="16" class="sans" font-weight="500" letter-spacing="-0.2">
    把模糊的审美感觉，转化为 AI 能 100% 精确执行的确定性设计工程资产
  </text>
  <text x="440" y="186" text-anchor="middle" fill="#71717A" font-size="13" class="sans" font-weight="400">
    The Complete Design Engineering &amp; Physics Motion Encyclopedia for AI Agents
  </text>

  <!-- Bottom Pills: Tags -->
  <g transform="translate(140, 222)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="132" height="24" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <text x="66" y="16" text-anchor="middle" fill="#A1A1AA" font-size="11" class="mono">🎨 Bento Grid</text>

    <!-- Pill 2 -->
    <rect x="144" y="0" width="156" height="24" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <text x="222" y="16" text-anchor="middle" fill="#A1A1AA" font-size="11" class="mono">🧲 Magnetic Physics</text>

    <!-- Pill 3 -->
    <rect x="312" y="0" width="144" height="24" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <text x="384" y="16" text-anchor="middle" fill="#A1A1AA" font-size="11" class="mono">🀄 2026 CJK Typo</text>

    <!-- Pill 4 -->
    <rect x="468" y="0" width="132" height="24" rx="12" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" />
    <text x="534" y="16" text-anchor="middle" fill="#A1A1AA" font-size="11" class="mono">⚡ Zero CLS = 0</text>
  </g>
</svg>
